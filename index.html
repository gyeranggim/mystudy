<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>주택관리사 현장 5~10문제</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#1d2433; --mute:#667085; --line:#e4e7ee;
  --accent:#3b6df0; --accent-soft:#e8eefe; --ok:#1a9f5c; --ok-soft:#e3f6ec; --bad:#d6403a; --bad-soft:#fdeceb;
  --warn:#e08a00; --warn-soft:#fff3dc; --story:#fff8e6; --story-line:#f1d48a;
  --shadow:0 1px 3px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12151c;--card:#1b1f29;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2c3242;
    --accent:#7a9bff;--accent-soft:#232c48;--ok:#4cc88a;--ok-soft:#173326;--bad:#ff7a73;--bad-soft:#3a1d1c;
    --warn:#f0b04a;--warn-soft:#3a2d12;--story:#2b2615;--story-line:#6b5a22;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.brand h1{font-size:17px;margin:0}
.tabs{display:flex;gap:4px}
.tab{white-space:nowrap;padding-left:2px!important;padding-right:2px!important;flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 4px;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--accent);border-color:var(--accent)}
.tab .bdg{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:4px}
main{padding:16px 0 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
/* dashboard */
.dash{display:flex;gap:16px;align-items:center}
.gauge{width:112px;height:112px;flex:none}
.g-bg{fill:none;stroke:var(--line);stroke-width:11}
.g-fg{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .5s}
.g-num{text-anchor:middle;font-size:24px;font-weight:700;fill:var(--ink)}
.g-sub{text-anchor:middle;font-size:11px;fill:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);font:inherit;padding:5px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.mix{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin:8px 0 4px}
.mix i{display:block;height:100%}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.subj{color:#fff;background:var(--sc,#667085)}
.dots{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;cursor:pointer;color:var(--mute);background:var(--card)}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.dot.c{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.w{background:var(--bad);border-color:var(--bad);color:#fff}
/* question */
.story{background:var(--story);border:1px solid var(--story-line);border-radius:12px;padding:12px 14px;margin:12px 0;position:relative}
.story .lab{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:2px}
.qtext{font-size:16.5px;font-weight:600;white-space:pre-wrap;margin:10px 0}
.photo-thumb{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0}
.choice{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .n{font-weight:700;color:var(--mute)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
details.tg{border:1px dashed var(--line);border-radius:10px;margin:8px 0;padding:0 12px}
details.tg summary{cursor:pointer;padding:9px 0;font-weight:600;color:var(--accent);list-style:none}
details.tg summary::-webkit-details-marker{display:none}
details.tg summary::before{content:"▸ ";}
details.tg[open] summary::before{content:"▾ ";}
details.tg .body{padding:0 0 10px}
.mline{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.mline span.t{flex:1}
.pin{border:0;background:none;cursor:pointer;opacity:.45;font-size:14px;padding:0 2px}
.pin:hover{opacity:1}
.result{border-radius:12px;padding:10px 14px;font-weight:700;margin:12px 0}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.sect{font-size:13px;font-weight:700;color:var(--mute);margin:18px 0 6px;letter-spacing:.02em}
.bubbles{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;display:flex;flex-direction:column}
.bub.l{align-self:flex-start}.bub.r{align-self:flex-end;align-items:flex-end}
.bub .who{font-size:12px;color:var(--mute);margin:0 6px 2px}
.bub .tx{background:var(--accent-soft);border-radius:14px 14px 14px 4px;padding:9px 13px;display:flex;gap:6px;align-items:flex-start}
.bub.r .tx{background:var(--warn-soft);border-radius:14px 14px 4px 14px}
/* diagram */
.dgm{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.dgm .ttl{font-size:13px;font-weight:700;margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.node{background:var(--card);border:1.5px solid var(--accent);border-radius:10px;padding:6px 12px;text-align:center;font-weight:700}
.node small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.arrow{color:var(--accent);font-weight:700;font-size:18px}
.bar{display:grid;grid-template-columns:92px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar .tr{background:var(--line);border-radius:6px;height:16px;overflow:hidden}
.bar .fl{height:100%;background:var(--accent);border-radius:6px;opacity:.55}
.bar.hl .fl{opacity:1;background:var(--warn)}
.bar .v{text-align:right;font-weight:700}
.tl{display:flex;border-radius:8px;overflow:hidden;height:34px}
.tl div{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
/* forms */
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mute)}
.qrow{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
.qrow:first-child{border-top:0}
/* notes */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note.done .ex{text-decoration:line-through;opacity:.55}
.ex{white-space:pre-wrap;font-weight:600;margin:6px 0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
/* floating */
#selbtn{position:fixed;display:none;z-index:50;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-weight:600;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.hero{background:linear-gradient(135deg,#3b6df0,#7c4dcc);color:#fff;border:0}
.hero .mute{color:rgba(255,255,255,.8)}
.hero .big{font-size:19px;font-weight:800}
.hero .xpbar{height:10px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;margin:8px 0 3px}
.hero .xpbar i{display:block;height:100%;background:#ffd84a;border-radius:6px;transition:width .6s}
.hero .pill{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px;border:0;color:#fff;font-family:inherit;cursor:pointer}
.week{display:flex;gap:6px;margin-top:10px}
.week div{flex:1;text-align:center;font-size:11px;opacity:.95}
.week b{display:grid;place-items:center;width:26px;height:26px;margin:2px auto 0;border-radius:50%;background:rgba(255,255,255,.2);font-size:13px}
.week .on b{background:#ffd84a;color:#5a3d00}
.gauge.full .g-fg{stroke:#f5b301}
.result .xp{font-size:13px;font-weight:600;margin-top:2px;opacity:.9}
.result{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-14px;width:9px;height:13px;z-index:70;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(720deg)}}
.stars{font-size:28px;letter-spacing:4px}
/* 클립보드 · 휴지통 */
.board{position:relative;background:linear-gradient(160deg,#ffc21a,#f59a00);border-radius:10px;padding:46px 16px 18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(150,90,0,.25)}
.clipper{position:absolute;z-index:6;top:10px;left:50%;width:112px;height:44px;transform:translateX(-50%);background:linear-gradient(#eef0f3,#8a919b 55%,#c9ced6);border-radius:8px 8px 12px 12px;box-shadow:0 3px 5px rgba(0,0,0,.3)}
.clipper::before{content:"";position:absolute;top:-12px;left:50%;width:34px;height:22px;transform:translateX(-50%);border:6px solid #9aa1ab;border-bottom:0;border-radius:16px 16px 0 0}
.stub{position:absolute;left:16px;right:16px;top:48px;height:22px;background:#fff;clip-path:polygon(0 100%,0 40%,5% 75%,11% 25%,17% 80%,24% 30%,31% 85%,38% 35%,45% 80%,52% 25%,59% 85%,66% 30%,73% 80%,80% 25%,87% 85%,94% 35%,100% 70%,100% 100%)}
.paper{--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e4e7ee;--bg:#f5f6fa;--accent:#3b6df0;--accent-soft:#e8eefe;--ok:#1a9f5c;--ok-soft:#e3f6ec;--bad:#d6403a;--bad-soft:#fdeceb;--warn:#e08a00;--warn-soft:#fff3dc;--story:#fff8e6;--story-line:#f1d48a;
  position:relative;background:#fff;color:var(--ink);border-radius:3px;padding:20px 18px 18px;box-shadow:0 2px 8px rgba(100,60,0,.3);transform-origin:50% 0;z-index:2}
.paper.in{animation:paperIn .5s cubic-bezier(.2,.8,.3,1)}
@keyframes paperIn{from{transform:translateY(-26px) rotate(-1.5deg);opacity:0}}
/* 층 오르기 타워 */
@keyframes bob{to{transform:translateY(-3px) rotate(3deg)}}
.climbov{position:fixed;inset:0;z-index:90;background:rgba(20,25,40,.6);display:grid;place-items:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.climbcard{width:min(92vw,380px);background:linear-gradient(#dff1ff,#fff);color:#1d2433;border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.climbcard .ct{font-weight:800;text-align:center;margin-bottom:10px}
.climbcard .cmsg{text-align:center;font-weight:700;margin-top:8px;color:#8a5a2b}
.cf{z-index:95}
.hhero{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:130px;margin-bottom:6px}
.hhero .hb{font-size:92px;line-height:1}
.hhero .hcl{width:80px;height:80px;animation:float 3.2s ease-in-out infinite}
/* 홈 */
.home{background:#fabe01;border-radius:20px;padding:20px 16px 0;overflow:hidden;color:#1f2a44;text-align:center}
@keyframes float{50%{transform:translateY(-6px)}}
.home .hsub{font-weight:700;font-size:14px;opacity:.8;margin:14px 0 0}
.home .htitle{font-size:clamp(28px,8.5vw,40px);font-weight:900;margin:2px 0 8px;letter-spacing:-.02em;text-shadow:0 2px 0 rgba(255,255,255,.55)}
.home .hpills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.home .hpills span{background:rgba(255,255,255,.55);border-radius:999px;padding:3px 14px;font-weight:800;font-size:13px}
.cabinet{background:#ffab0f;margin:0 -16px;padding:16px 16px 0}
.cabinet .cl{font-weight:800;color:#fff;text-align:left;margin-bottom:10px;font-size:14px;text-shadow:0 1px 2px rgba(150,80,0,.4)}
.fold{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;font:inherit;text-align:left;position:relative;margin-top:-24px;transition:transform .15s}
.fold:first-of-type{margin-top:0}
.fold:hover{transform:translateY(-5px)}
.fold .tabl{display:inline-block;margin-left:var(--off,0);background:#fff;color:#e8920a;font-weight:900;font-size:18px;padding:9px 26px 7px;border-radius:14px 14px 0 0;box-shadow:0 -2px 5px rgba(140,80,0,.12);position:relative}
.fold .fb{background:#fff;height:78px;border-radius:0 16px 0 0;box-shadow:0 -3px 8px rgba(140,80,0,.18);display:flex;justify-content:flex-end;padding:10px 18px;color:#9a8f7e;font-size:13px;font-weight:700}
.fold:last-of-type .fb{height:92px}
.fold .clip{position:absolute;left:14px;top:46px;font-size:26px;transform:rotate(-20deg)}
.allbtn{margin:0 0 14px;background:#1f2a44;color:#fff;border:0}
@media(max-width:480px){.dash{flex-direction:column;align-items:stretch}.gauge{align-self:center}.grid2{grid-template-columns:1fr}.bar{grid-template-columns:70px 1fr 60px}}
/* ===== 귀여운 테마 (곰 캐릭터) ===== */
:root{--bg:#f2f7ff;--card:#fff;--line:#e2eaf6;--accent:#3f74d8;--accent-soft:#e4eeff;--mute:#6b7a96;--ink:#22304a;--shadow:0 4px 14px rgba(63,116,216,.10)}
@media (prefers-color-scheme: dark){:root{--bg:#141a26;--card:#1d2535;--line:#2c3850;--accent:#7aa2ff;--accent-soft:#25324f;--mute:#9aa8c4;--ink:#e8edf8;--shadow:none}}
h1,h2,.sectt,.tab{font-family:"Jua","Pretendard","Malgun Gothic",system-ui,sans-serif}
.brand{padding:10px 0}
.brand h1{display:flex;align-items:center;gap:8px;font-size:20px;cursor:pointer}
.brand h1 img{width:36px;height:34px;object-fit:contain}
.ddp{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:800;border-radius:999px;padding:5px 14px;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;gap:2px;padding:5px 8px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(63,116,216,.10)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12.5px;padding:5px 0 4px!important;border:0!important;border-radius:14px;color:var(--mute)}
.tab .ti{font-size:22px;line-height:1.15}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.tab .bdg{position:absolute;top:0;right:14%;margin:0}
main.wrap{padding-bottom:130px}
#toast{bottom:90px}
.card{border-radius:22px}
.btn{border-radius:14px}
.btn.pri{background:linear-gradient(135deg,#4d86ee,#3463c7);border:0;box-shadow:0 4px 10px rgba(63,116,216,.3)}
.btn.big{width:100%;padding:14px;font-size:17px;border-radius:16px}
.choice{border-radius:16px}
.chip{font-weight:700}
.result{display:flex;align-items:center;gap:10px}
.rbear{width:48px;flex:none;animation:hop .7s ease}
@keyframes hop{30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
/* 홈 */
.bhero{background:linear-gradient(165deg,#fff3c4 0%,#e6f1ff 62%,#dbe9ff 100%);border-radius:26px;padding:16px;text-align:center;position:relative;margin-bottom:6px;box-shadow:var(--shadow);color:#22304a}
.bhero .bearimg{width:54%;max-width:230px;display:block;margin:50px 0 2px 4%;animation:float 3.2s ease-in-out infinite}
.bubble{position:relative;display:inline-block;max-width:92%;margin:0 auto 12px;background:#fff;border-radius:16px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:left;color:#22304a;line-height:1.4}
.bubble::after{content:"";position:absolute;left:50%;margin-left:-8px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.bhero h2{font-size:24px;margin:4px 0 2px}
.bhero .sub{font-size:14px;color:#51607d}
.pbar{height:16px;border-radius:99px;background:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);overflow:hidden;margin:10px 0 14px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8ccdf5,#3f74d8);transition:width .6s}
.sectt{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px;font-size:19px}
.sectt span{font-family:inherit;font-size:13px;color:var(--mute)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{border:1.5px solid;border-radius:20px;padding:14px;text-align:left;font:inherit;cursor:pointer;position:relative;min-height:96px;transition:transform .15s}
.mcard:hover{transform:translateY(-3px)}
.mcard b{display:block;font-family:"Jua","Pretendard",sans-serif;font-size:17px;font-weight:400}
.mcard small{font-size:12px;opacity:.75}
.mcard .mi{position:absolute;right:10px;bottom:6px;font-size:36px}
.m1{background:#e1eeff;border-color:#bcd6ff;color:#27406f}
.m2{background:#ffe3e5;border-color:#ffc2c8;color:#7a2d36}
.m3{background:#eadfff;border-color:#cfbaff;color:#43307a}
.m4{background:#dff5e4;border-color:#b7e6c2;color:#24593a}
.cabwrap{border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.cabwrap .cabinet{margin:0}
.stat .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat .pills span{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}

.fico{width:22px;height:22px;object-fit:contain;vertical-align:-5px}
/* 모험 지도 */
.tcard summary{cursor:pointer;font-weight:800;list-style:none}
.mapbox{position:relative;width:100%;max-width:380px;margin:10px auto 0;border-radius:20px;overflow:hidden;background:linear-gradient(#f4fbe9,#e3f5d0);border:3px solid #bfe3a8}
.mapbox svg{display:block;width:100%;height:100%}
.rd{fill:none;stroke:#f1dcae;stroke-width:24;stroke-linecap:round}
.rd.hl{stroke:#ffcf5a}
.roadline{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round;opacity:.9}
.deco{font-size:20px;text-anchor:middle}
.lb{font-size:11px;font-weight:800;text-anchor:middle;fill:#6a5a2c}
.nd .nc{fill:#fff;stroke:#c5cfe3;stroke-width:3}
.nd.ok .nc{fill:#e3f6ec;stroke:#1a9f5c}
.nd.bad .nc{fill:#fdeceb;stroke:#d6403a}
.nd.cur .nc{stroke:#3f74d8;stroke-width:4}

function addXp(n){
  const before = Math.floor(stats.xp/100); stats.xp += n; save(LS.st, stats);
  if (Math.floor(stats.xp/100) > before) { toast('🎉 레벨 업! ' + LEVELS[Math.min(Math.floor(stats.xp/100), LEVELS.length-1)]); confetti(60); }
}
function touchStreak(){
  const t = todayStr(); if (stats.last === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  stats.streak = stats.last === ymd(y) ? stats.streak + 1 : 1;
  stats.best = Math.max(stats.best, stats.streak); stats.last = t;
}
function confetti(n = 40){
  const cols = ['#3b6df0','#ffd84a','#1a9f5c','#e08a00','#d6403a','#7c4dcc'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i'); d.className = 'cf';
    d.style.left = (Math.random()*100) + 'vw'; d.style.background = cols[i % cols.length];
    d.style.setProperty('--dx', (Math.random()*160 - 80) + 'px'); d.style.animationDelay = (Math.random()*.4) + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 2400);
  }
}
function heroCard(done, total){
  const h = new Date().getHours();
  const greet = h < 6 ? '🌙 늦은 시간까지 대단해요' : h < 12 ? '☀️ 좋은 아침이에요' : h < 18 ? '🌤️ 오늘도 한 걸음' : '🌙 오늘 하루 마무리해요';
  const lv = Math.floor(stats.xp/100), title = LEVELS[Math.min(lv, LEVELS.length-1)];
  const days = [...Array(7)].map((_,k) => { const d = new Date(); d.setDate(d.getDate() - (6-k)); return {on: (stats.days[ymd(d)]||0) > 0, l: '일월화수목금토'[d.getDay()]}; });
  const dd = stats.dday ? Math.ceil((Date.parse(stats.dday + 'T00:00:00') - Date.parse(todayStr() + 'T00:00:00')) / 864e5) : null;
  const ddTxt = dd === null ? '🎯 시험일 설정' : dd > 0 ? '🎯 D-' + dd : dd === 0 ? '🎯 D-DAY!' : '🎯 D+' + (-dd);
  const msg = total && done === total ? '🏆 오늘 목표 달성! 대단해요' : done === 0 ? (stats.streak ? `오늘 풀면 🔥 ${stats.streak + (stats.last === todayStr() ? 0 : 1)}일 연속!` : '첫 문제만 풀면 연속 학습이 시작돼요 🔥') : `앞으로 ${total - done}문제만 더!`;
  return `<div class="card hero"><div class="row"><div><div class="mute">${greet}</div><div class="big">${msg}</div></div><span class="sp"></span><button class="pill" data-action="dday">${ddTxt}</button></div>
    <div class="row" style="margin-top:10px"><span class="pill">🔥 ${stats.streak}일 연속</span><span class="pill">Lv.${lv+1} ${title}</span><span class="mute">최고 ${stats.best}일</span></div>
    <div class="xpbar"><i style="width:${stats.xp % 100}%"></i></div><div class="mute">${stats.xp % 100}/100 XP · 다음 레벨까지 ${100 - stats.xp % 100} XP</div>
    <div class="week">${days.map(d => `<div class="${d.on ? 'on' : ''}">${d.l}<b>${d.on ? '✓' : ''}</b></div>`).join('')}</div></div>`;
}

function buildQueue(need, excludeIds){
  const pool = questions.filter(q => !excludeIds.includes(q.id) && (!session.subject || (session.subject === '__wrong' ? isWrongQ(q) : q.subject === session.subject)));
  const reviewN = session.subject === '__wrong' ? need : Math.round(need * 0.3);
  const review = pool.filter(isWrongQ)
    .sort((a,b) => (a.last_studied_at ? Date.parse(a.last_studied_at) : 0) - (b.last_studied_at ? Date.parse(b.last_studied_at) : 0))
    .slice(0, reviewN);
  const rest = pool.filter(q => !review.includes(q));

/* ============ 사진 업로드 / AI ============ */
function downscale(file, max = 1100, quality = .72){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽을 수 없습니다')); };
    img.src = url;
  });
}
$('#photo').addEventListener('change', async e => {

async function callClaude(prompt, imageUrl){   // 이름은 유지, 실제로는 Google Gemini(AI Studio) 호출
  const parts = [];
  if (imageUrl) parts.push({inline_data:{mime_type:'image/jpeg', data: imageUrl.split(',')[1]}});
  parts.push({text: prompt});
  const first = (ai.model && !/^claude|^gemini-(1|2)\./i.test(ai.model)) ? ai.model : 'gemini-3.5-flash';
  const chain = [first, 'gemini-3.5-flash', 'gemini-3.6-flash', 'gemini-3.1-flash-lite'].filter((m, i, a) => a.indexOf(m) === i);
  let r;
  for (let n = 0; n < chain.length; n++) {      // 과부하(503/429)면 다음 모델로 자동 전환
    r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(chain[n]) + ':generateContent', {method:'POST',
      headers:{'content-type':'application/json','x-goog-api-key':ai.key},
      body: JSON.stringify({contents:[{role:'user', parts}], generationConfig:{responseMimeType:'application/json', maxOutputTokens:4096}})});
    if (r.status !== 503 && r.status !== 429 && r.status !== 404) break;
    if (n < chain.length - 1) toast('AI가 바빠서 다른 모델로 다시 시도 중…');
  }
  const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
  const t = ((j.candidates || [])[0]?.content?.parts || []).map(c => c.text || '').join(''), m = t.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('JSON 응답을 찾지 못했습니다'); return JSON.parse(m[0]);
}

function saveReg(){
  const choices = reg.c.map(c => c.trim());
  if (!reg.question_text.trim()) { toast('문제 본문을 입력하세요'); return; }
  if (choices.filter(Boolean).length < 2) { toast('보기를 2개 이상 입력하세요'); return; }
  const dlg = reg.dialogue.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^([^:：]{1,20})[:：]\s*(.+)$/); return m ? {who:m[1].trim(), text:m[2].trim()} : {who:subjInfo(reg.subject).roles[0], text:l}; });
  const q = {id:'u' + Date.now(), user:true, subject:reg.subject, chapter_order: +reg.chapter_order || (Math.max(0, ...questions.map(x => x.chapter_order)) + 1), chapter_name: reg.chapter_name.trim() || '미분류',
    question_text:reg.question_text.trim(), choices:choices.filter(Boolean).length === 5 ? choices : choices, answer:+reg.answer,
    field_story:reg.field_story.trim(), hint:reg.hint.trim(), micro_concept:reg.micro.split('\n').map(s => s.trim()).filter(Boolean),
    dialogue_explanation:dlg, visual_diagram:reg.visual, variant_data:null, image:reg.image,
    attempt_count:0, wrong_count:0, is_wrong_last_time:false, last_studied_at:null};
  questions.push(q);
  if (!save(LS.q, questions)) { q.image = null; if (!save(LS.q, questions)) { questions.pop(); return; } toast('사진은 용량 문제로 제외하고 저장했어요'); }
  else toast('✅ 문제를 저장했어요');
  if (reg.addToday) { ensureSession(); session.ids.push(q.id); session.done = false; save(LS.s, session); }
  reg = {subject:reg.subject, chapter_order:'', chapter_name:'', question_text:'', c:['','','','',''], answer:'1', field_story:'', hint:'', micro:'', dialogue:'', visual:null, image:null, addToday:reg.addToday};
  render();
}

/* ============ 이벤트 ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'ndone') return; // change 이벤트에서 처리
  switch (a) {
    case 'tab': tab = el.dataset.t; render(); window.scrollTo(0,0); break;
    case 'goal': goal = +el.dataset.n; save(LS.g, goal); ensureSession(); session.target = goal; fillQueue(); picked = null; render(); break;
    case 'pick': picked = +el.dataset.n; render(); break;
    case 'submit': submitAnswer(); break;
    case 'goto': session.idx = +el.dataset.i; session.done = false; picked = null; save(LS.s, session); render(); break;
    case 'login': doLogin(); break;
    case 'logout': cloudLogout(); break;
    case 'enter': try { sessionStorage.setItem('hj_seen', '1'); } catch (e) {} tab = 'home'; render(); window.scrollTo(0,0); break;
    case 'rename': { const v = prompt('이름(닉네임)을 입력하세요', stats.name || ''); if (v !== null) { stats.name = v.trim().slice(0, 12) || null; save(LS.st, stats); render(); } break; }
    case 'folder': case 'allsubj': {
      const s = a === 'folder' ? el.dataset.s : null; ensureSession();
      if ((session.subject || null) !== s) newSession(s);
      picked = null; tab = 'today'; render(); window.scrollTo(0,0); break; }
    case 'dday': { const v = prompt('시험일을 입력하세요 (예: 2027-10-30). 지우려면 비워두세요.', stats.dday || ''); if (v !== null) { stats.dday = /^\d{4}-\d{2}-\d{2}$/.test(v.trim()) ? v.trim() : null; save(LS.st, stats); render(); } break; }
    case 'next': nextQ(); break;
    case 'review': session.done = false; session.idx = 0; save(LS.s, session); render(); break;
    case 'resume': ensureSession(); if (session.ids.length && answeredN() >= session.ids.length) newSession(); picked = null; tab = 'today'; render(); window.scrollTo(0,0); break;
    case 'wrongsession':
      if (!questions.some(isWrongQ)) { toast('아직 틀린 문제가 없어요! 👏'); break; }
      ensureSession(); newSession('__wrong'); picked = null; tab = 'today'; render(); window.scrollTo(0,0); break;
    case 'newset': newSession(); picked = null; tab = 'today'; render(); window.scrollTo(0,0); break;
    case 'addphoto': $('#photo').click(); break;
    case 'rmphoto': reg.image = null; render(); break;
    case 'ocr': doOcr(); break;
    case 'gen': doGen(); break;
    case 'aisave': ai = {key: $('#aikey').value.trim(), model: $('#aimodel').value.trim() || 'gemini-3.5-flash'}; save(LS.ai, ai); toast('AI 설정을 저장했어요'); render(); break;
    case 'regsave': saveReg(); break;
    case 'regclear': reg = {...reg, chapter_order:'', chapter_name:'', question_text:'', c:['','','','',''], answer:'1', field_story:'', hint:'', micro:'', dialogue:'', visual:null, image:null}; render(); break;
    case 'delq': if (confirm('이 문제를 삭제할까요?')) { questions = questions.filter(q => q.id !== el.dataset.id); save(LS.q, questions); ensureSession(); render(); } break;
    case 'savetext': addNote(el.dataset.text, el.dataset.qid); break;
    case 'nfilter': noteFilter = el.dataset.s; render(); break;
    case 'ndel': notes = notes.filter(n => n.id !== el.dataset.id); save(LS.n, notes); render(); break;
    case 'tool3': questions.forEach(q => { if (q.attempt_count < 3) q.attempt_count = 3; }); save(LS.q, questions); toast('모든 문제가 3회독 상태예요. "세트 다시 만들기"를 눌러보세요'); render(); break;
    case 'toolrebuild': newSession(); picked = null; render(); toast('오늘 세트를 다시 만들었어요'); break;
    case 'toolreset': if (confirm('모든 학습 기록(풀이 횟수·오답 이력·오늘 세트)을 초기화할까요? 암기노트는 유지됩니다.')) {
        questions.forEach(q => { q.attempt_count = 0; q.wrong_count = 0; q.is_wrong_last_time = false; q.last_studied_at = null; });
        save(LS.q, questions); newSession(); picked = null; render(); toast('학습 기록을 초기화했어요'); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.action === 'ndone') { const n = notes.find(x => x.id === el.dataset.id); if (n) { n.is_memorized = el.checked; save(LS.n, notes); render(); } return; }
  if (el.dataset.f === 'subject' || el.dataset.f === 'addToday') { reg[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.f === 'subject') render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.memo) { const n = notes.find(x => x.id === el.dataset.memo); if (n) { n.user_note = el.value; save(LS.n, notes); } return; }
  const f = el.dataset.f; if (!f || el.type === 'checkbox') return;
  if (/^c[0-4]$/.test(f)) reg.c[+f[1]] = el.value; else reg[f] = el.value;
});

/* ============ Supabase 로그인 + 데이터 동기화 ============ */
function loginHtml(){
  if (!cloud.ready) return `<section class="splash"><img class="stitle" src="assets/dori_title.png" alt=""><div class="shint">불러오는 중...</div></section>`;
  const f = 'width:100%;box-sizing:border-box;padding:13px 14px;border:2px solid #a9d6e6;border-radius:14px;font:inherit;font-size:16px;margin-bottom:10px;background:#fff;color:#1f3a4a';
  return `<section class="splash" style="cursor:default"><img class="stitle" src="assets/dori_title.png" alt="도리의 주택관리사 합격단">
    <img src="assets/dori.png" alt="" style="width:34%;max-width:140px;margin:6px 0 10px">
    <div style="width:min(86%,340px)"><input id="lgmail" type="email" autocomplete="username" placeholder="이메일" style="${f}">
    <input id="lgpw" type="password" autocomplete="current-password" placeholder="비밀번호" style="${f}">
    <button class="btn pri big" style="width:100%" data-action="login">로그인</button>
    <div class="shint" id="lgmsg" style="text-align:center">${esc(cloud.msg)}</div></div></section>`;
}
function cloudBar(){
  if (!cloud.sb) return '';
  return `<div class="mute" style="text-align:center;font-size:12px;margin-top:18px">☁️ ${cloud.user ? esc(cloud.user.email) + (cloud.ok ? ' · 동기화됨' : ' · 동기화 오류(이 기기에만 저장 중)') : ''} <button class="btn sm" data-action="logout" style="margin-left:6px">로그아웃</button></div>`;
}
const cloudKind = k => k === LS.q ? 'question' : k === LS.n ? 'note' : 'state';
function cloudRows(k, v){
  if (k === LS.q) return (v || []).map(q => [q.id, q]);
  if (k === LS.n) return (v || []).map(n => [n.id, n]);
  if (k === LS.s || k === LS.g || k === LS.st || k === LS.ai) return [[k, {v}]];
  return null;
}
function cloudPush(k, v){
  if (!cloud.user || !cloud.ok || cloud.pulling || !cloudRows(k, v)) return;
  clearTimeout(cloud.timers[k]); cloud.timers[k] = setTimeout(() => cloudFlush(k, v), 700);
}
async function cloudFlush(k, v){
  const kind = cloudKind(k), rows = cloudRows(k, v); if (!rows) return;
  const ups = [], ids = new Set(rows.map(r => r[0]));
  rows.forEach(([id, data]) => { const s = JSON.stringify(data); if (cloud.synced[kind + '/' + id] !== s) ups.push({kind, id, data, _s: s}); });
  const gone = kind === 'state' ? [] : Object.keys(cloud.synced).filter(x => x.startsWith(kind + '/') && !ids.has(x.slice(kind.length + 1))).map(x => x.slice(kind.length + 1));
  try {
    for (let i = 0; i < ups.length; i += 10) {
      const b = ups.slice(i, i + 10), now = new Date().toISOString();
      const {error} = await cloud.sb.from('mystudy').upsert(b.map(({kind, id, data}) => ({kind, id, data, updated_at: now})), {onConflict: 'user_id,kind,id'});
      if (error) throw error; b.forEach(r => { cloud.synced[r.kind + '/' + r.id] = r._s; });
    }
    if (gone.length) { const {error} = await cloud.sb.from('mystudy').delete().eq('kind', kind).in('id', gone); if (error) throw error; gone.forEach(id => delete cloud.synced[kind + '/' + id]); }
  } catch (e) { cloud.ok = false; toast('서버 저장에 실패했어요. 이 기기에는 저장됐어요'); console.warn(e); }
}
const cloudPushNow = (k, v) => setTimeout(() => cloudFlush(k, v), 1500);
async function cloudPull(){
  const {data, error} = await cloud.sb.from('mystudy').select('kind,id,data').limit(10000);
  if (error) throw error;
  cloud.synced = {}; data.forEach(r => { cloud.synced[r.kind + '/' + r.id] = JSON.stringify(r.data); });
  if (!data.length) { cloud.ok = true; for (const k of [LS.q, LS.n, LS.s, LS.g, LS.st, LS.ai]) await cloudFlush(k, k === LS.q ? questions : k === LS.n ? notes : k === LS.s ? session : k === LS.g ? goal : k === LS.ai ? ai : stats); return; }
  cloud.pulling = true;
  const qs = data.filter(r => r.kind === 'question').map(r => r.data), ns = data.filter(r => r.kind === 'note').map(r => r.data);
  const st = k => { const r = data.find(x => x.kind === 'state' && x.id === k); return r ? r.data.v : undefined; };
  if (qs.length) questions = qs; notes = ns;
  if (st(LS.ai) !== undefined) ai = st(LS.ai); else if (ai && ai.key) cloudPushNow(LS.ai, ai);
  if (st(LS.g) !== undefined) goal = st(LS.g); if (st(LS.s) !== undefined) session = st(LS.s); if (st(LS.st) !== undefined) stats = st(LS.st);
  save(LS.q, questions); save(LS.n, notes); save(LS.g, goal); save(LS.s, session); save(LS.st, stats); save(LS.ai, ai);
  cloud.pulling = false; cloud.ok = true;
  if (typeof ensureSession === 'function') ensureSession();
}
async function cloudStart(user){
  cloud.user = user; cloud.ok = false;
  try { await cloudPull(); } catch (e) { cloud.pulling = false; cloud.ok = false; toast('서버에서 불러오지 못했어요. 이 기기 데이터로 열어요'); console.warn(e); }
  render();
}
async function doLogin(){
  const email = ($('#lgmail') || {}).value, password = ($('#lgpw') || {}).value, m = $('#lgmsg');
  if (!email || !password) { m.textContent = '이메일과 비밀번호를 입력하세요'; return; }
  m.textContent = '로그인 중...';
  const {data, error} = await cloud.sb.auth.signInWithPassword({email: email.trim(), password});
  if (error) { m.textContent = '로그인 실패: 이메일/비밀번호를 확인하세요'; return; }
  await cloudStart(data.user);
}
async function cloudLogout(){
  if (!confirm('로그아웃할까요? (이 기기의 임시 데이터는 지워지고, 서버 데이터는 그대로 있어요)')) return;
  try { await cloud.sb.auth.signOut(); } catch (e) {}
  Object.values(LS).forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  location.reload();
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'lgpw' || e.target.id === 'lgmail')) doLogin(); });
(async () => {
  if (!cloud.sb) { cloud.ready = true; return; }
  try { const {data} = await cloud.sb.auth.getSession(); cloud.ready = true; if (data.session) await cloudStart(data.session.user); else render(); }
  catch (e) { cloud.ready = true; render(); }
})();

render();
</script>
